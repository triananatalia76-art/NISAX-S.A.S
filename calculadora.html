<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Financial Calculator</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 20px; }\n        .container { max-width: 800px; margin: auto; }\n        h1 { text-align: center; }\n        input, select { width: 100%; padding: 10px; margin: 10px 0; }\n        button { padding: 10px; width: 100%; }\n        .result { margin-top: 20px; }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h1>Financial Calculator</h1>\n        <h2>Rate Conversion</h2>\n        <label for="rate">Enter Rate (%)</label>\n        <input type="number" id="rate" placeholder="Rate in %">\n        <button onclick="convertRate()">Convert Rate</button>\n        <div class="result" id="rateResult"></div>\n        <h2>Present/Future Value</h2>\n        <label for="presentValue">Present Value</label>\n        <input type="number" id="presentValue" placeholder="Present Value">\n        <label for="futureValue">Future Value</label>\n        <input type="number" id="futureValue" placeholder="Future Value">\n        <button onclick="calculatePV()">Calculate</button>\n        <div class="result" id="pvResult"></div>\n        <h2>Annuities</h2>\n        <label for="annuity">Enter Annuity Amount</label>\n        <input type="number" id="annuity" placeholder="Annuity Amount">\n        <button onclick="calculateAnnuity()">Calculate Annuity</button>\n        <div class="result" id="annuityResult"></div>\n        <h2>Economic Diagrams & Amortization</h2>\n        <button onclick="showDiagrams()">Show Economic Diagrams</button>\n        <button onclick="showAmortization()">Generate Amortization Table</button>\n        <div class="result" id="diagramResult"></div>\n        <div class="result" id="amortizationResult"></div>\n    </div>\n    <script>\n        function convertRate() {\n            const rate = document.getElementById('rate').value;\n            const convertedRate = rate / 100; // Simplified example\n            document.getElementById('rateResult').innerText = `Converted Rate: ${convertedRate}`;\n        }\n        function calculatePV() {\n            const pv = document.getElementById('presentValue').value;\n            const fv = document.getElementById('futureValue').value;\n            // Calculate Future Value as an example\n            const result = fv - pv;\n            document.getElementById('pvResult').innerText = `Calculated Future Value: ${result}`;\n        }\n        function calculateAnnuity() {\n            const annuity = document.getElementById('annuity').value;\n            // Simple return based on annuity for demo purposes\n            const result = `Annuity Calculated: ${annuity * 1.05}`;  // Assume some calculation\n            document.getElementById('annuityResult').innerText = result;\n        }\n        function showDiagrams() {\n            document.getElementById('diagramResult').innerText = 'Economic diagrams would be rendered here.';\n        }\n        function showAmortization() {\n            document.getElementById('amortizationResult').innerText = 'Amortization table would be generated here.';\n        }\n    </script>\n</body>\n</html>
